# Render Configuration for Agrify Soil Testing System
# This file defines both backend and frontend services for free deployment

services:
  # Backend API Service
  - type: web
    name: agrify-backend
    runtime: node
    env: node
    region: oregon  # Free tier region
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false  # Will be set manually in Render dashboard
      - key: JWT_SECRET
        sync: false  # Will be set manually in Render dashboard
      - key: CLIENT_URL
        sync: false  # Will be set to frontend URL after deployment
      - key: OPENAI_API_KEY
        sync: false  # Optional - for AI features
    autoDeploy: true

  # Frontend Web Service
  - type: web
    name: agrify-frontend
    runtime: node
    env: node
    region: oregon  # Free tier region
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false  # Will be set to backend URL after deployment
    autoDeploy: true
